name: Bug report
description: Something is broken on the web shelf
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in every section.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Covers have no progress, wrong percent, ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://weread.qq.com/web/shelf
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Chrome 152 / Tampermonkey 5.5.0 / script 0.1.3
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Allow user scripts is enabled on Tampermonkey
          required: true
        - label: I fully quit the browser and reopened the shelf
          required: false
