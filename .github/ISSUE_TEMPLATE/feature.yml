name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What is hard to do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposal
    validations:
      required: true
